<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>投票文メーカー | PLUTOSYSTEM</title>
<style>
  :root { --ink: #1f2328; --sub: #59636e; --line: #d1d9e0; --bg: #f6f8fa; --card: #fff; --accent: #0969da; --soft: #eef5ff; --err: #cf222e; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); line-height: 1.6;
         font-family: system-ui, -apple-system, "Segoe UI", "Hiragino Sans", "Yu Gothic UI", Meiryo, sans-serif; }
  header { background: var(--card); border-bottom: 1px solid var(--line); padding: 10px 16px; }
  header a { color: var(--sub); text-decoration: none; font-size: 14px; }
  main { max-width: 640px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 22px; margin: 8px 0 16px; }
  h2 { font-size: 16px; margin: 0 0 8px; }
  section { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 16px; margin-bottom: 16px; }
  label.field { display: block; font-weight: 600; margin-bottom: 4px; }
  .group + .group { margin-top: 12px; }
  input[type=text] { width: 100%; padding: 8px 10px; font: inherit; font-size: 16px; border: 1px solid var(--line); border-radius: 6px; }
  button { font: inherit; font-size: 14px; padding: 6px 14px; border: 1px solid var(--line); border-radius: 6px; background: var(--card); color: var(--ink); cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:disabled { opacity: .45; cursor: default; }
  .note { color: var(--sub); font-size: 13px; margin: 4px 0 0; }
  .note.err { color: var(--err); }
  .row { display: flex; gap: 8px; }
  .row input { flex: 1; min-width: 0; }

  .tags { list-style: none; padding: 0; margin: 0 0 12px; }
  .tags li { display: flex; align-items: center; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--line); }
  .tags .tag { flex: 1; overflow-wrap: anywhere; }
  .tags .tag.off { color: var(--sub); text-decoration: line-through; }
  .tags .kind { color: var(--sub); font-size: 12px; }
  .tags label { font-size: 13px; color: var(--sub); white-space: nowrap; cursor: pointer; }
  .tags button { padding: 2px 10px; font-size: 13px; }

  #output { display: block; width: 100%; min-height: 128px; padding: 12px; text-align: left; white-space: pre-wrap; overflow-wrap: anywhere;
            font-size: 16px; line-height: 1.7; background: var(--soft); border: 1px dashed var(--accent); border-radius: 6px; }
  #output:disabled { opacity: 1; color: var(--sub); background: var(--bg); border-color: var(--line); }
  .actions { display: flex; justify-content: flex-end; margin-top: 12px; }

  .history { list-style: none; padding: 0; margin: 0; }
  .history li { padding: 10px 0; border-bottom: 1px solid var(--line); }
  .history li:last-child { border-bottom: 0; }
  .history .text { white-space: pre-wrap; overflow-wrap: anywhere; font-size: 14px; }
  .history .meta { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
  .history .date { flex: 1; color: var(--sub); font-size: 12px; }
  .history button { padding: 2px 10px; font-size: 13px; }

  #toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #1f2328; color: #fff;
           padding: 8px 16px; border-radius: 6px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  #toast.show { opacity: 1; }
</style>
</head>
<body>
<header><a href="/">← PLUTOSYSTEM</a></header>
<main>
  <h1>投票文メーカー</h1>

  <section>
    <div class="group">
      <label class="field" for="singer">Singer</label>
      <input type="text" id="singer" list="singer-list" autocomplete="off">
      <datalist id="singer-list"></datalist>
      <p class="note" id="singer-note" hidden></p>
    </div>
    <div class="group">
      <label class="field" for="song">曲名</label>
      <input type="text" id="song" list="song-list" autocomplete="off">
      <datalist id="song-list"></datalist>
      <p class="note" id="song-note" hidden></p>
    </div>
  </section>

  <section>
    <h2>タグ</h2>
    <ul class="tags" id="tags"></ul>
    <div class="row">
      <input type="text" id="new-tag" placeholder="追加するタグ（# は無くても可）" autocomplete="off">
      <button type="button" id="add-tag">追加</button>
    </div>
    <p class="note err" id="tag-error" hidden></p>
  </section>

  <section>
    <h2>投稿文</h2>
    <button type="button" id="output" disabled></button>
    <p class="note">欄をクリックすると、投稿文をコピーします。</p>
    <div class="actions"><button type="button" class="primary" id="save" disabled>保存</button></div>
  </section>

  <section>
    <h2>保存した投稿文</h2>
    <ul class="history" id="history"></ul>
  </section>
</main>
<div id="toast" role="status" aria-live="polite"></div>

<script>
const DEFAULT_TAGS = ['VTuber楽曲ランキング', 'ミューコミVR']
const KEY_TAGS = 'pluto.vote.tags'          // 追加したタグ
const KEY_HISTORY = 'pluto.vote.history'    // 保存した投稿文
const EMPTY_TEXT = 'Singer と曲名を入れると、ここに投稿文ができます。'

const $ = (id) => document.getElementById(id)
const excluded = new Set()                  // 「除外」にチェックが入っているタグ
let addedTags = load(KEY_TAGS)
let history = load(KEY_HISTORY)

// ブラウザの保存領域は使えない環境（プライベートウインドウ等）もあるため、失敗しても画面は動かす
function load(key) {
  try { return JSON.parse(localStorage.getItem(key)) ?? [] } catch { return [] }
}
function store(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); return true } catch { return false }
}

let toastTimer
function toast(message) {
  $('toast').textContent = message
  $('toast').classList.add('show')
  clearTimeout(toastTimer)
  toastTimer = setTimeout(() => $('toast').classList.remove('show'), 1600)
}

function showNote(id, message, isError = false) {
  $(id).textContent = message
  $(id).classList.toggle('err', isError)
  $(id).hidden = !message
}

function activeTags() {
  return [...DEFAULT_TAGS, ...addedTags].filter((t) => !excluded.has(t))
}

function buildText() {
  const singer = $('singer').value.trim()
  const song = $('song').value.trim()
  if (!singer || !song) return ''
  const tags = activeTags()
  return `${singer}の『${song}』に投票します！` + (tags.length ? '\n\n' + tags.map((t) => '#' + t).join('\n') : '')
}

function update() {
  const text = buildText()
  $('output').textContent = text || EMPTY_TEXT
  $('output').disabled = !text
  $('save').disabled = !text
}

function renderTags() {
  $('tags').replaceChildren(...[...DEFAULT_TAGS, ...addedTags].map((tag) => {
    const li = document.createElement('li')
    const name = document.createElement('span')
    name.className = 'tag' + (excluded.has(tag) ? ' off' : '')
    name.textContent = '#' + tag
    li.append(name)
    if (DEFAULT_TAGS.includes(tag)) {
      const kind = document.createElement('span')
      kind.className = 'kind'
      kind.textContent = 'デフォルト'
      li.append(kind)
    }
    const label = document.createElement('label')
    const box = document.createElement('input')
    box.type = 'checkbox'
    box.checked = excluded.has(tag)
    box.addEventListener('change', () => {
      box.checked ? excluded.add(tag) : excluded.delete(tag)
      renderTags()
      update()
    })
    label.append(box, ' 除外')
    li.append(label)
    if (!DEFAULT_TAGS.includes(tag)) {
      const del = document.createElement('button')
      del.type = 'button'
      del.textContent = '削除'
      del.addEventListener('click', () => {
        addedTags = addedTags.filter((t) => t !== tag)
        excluded.delete(tag)
        store(KEY_TAGS, addedTags)
        renderTags()
        update()
      })
      li.append(del)
    }
    return li
  }))
}

function addTag() {
  const tag = $('new-tag').value.trim().replace(/^[#＃]+/, '')
  if (!tag) return
  if (/\s/.test(tag)) return showNote('tag-error', 'タグに空白は使えません。', true)
  if (DEFAULT_TAGS.includes(tag) || addedTags.includes(tag)) return showNote('tag-error', 'そのタグはすでにあります。', true)
  addedTags.push(tag)
  store(KEY_TAGS, addedTags)
  $('new-tag').value = ''
  showNote('tag-error', '')
  renderTags()
  update()
}

function formatDate(iso) {
  const d = new Date(iso)
  const p = (n) => String(n).padStart(2, '0')
  return `${d.getFullYear()}/${p(d.getMonth() + 1)}/${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`
}

function renderHistory() {
  if (!history.length) {
    const li = document.createElement('li')
    li.className = 'note'
    li.textContent = 'まだ保存した投稿文はありません。'
    return $('history').replaceChildren(li)
  }
  $('history').replaceChildren(...history.map((entry, i) => {
    const li = document.createElement('li')
    const text = document.createElement('div')
    text.className = 'text'
    text.textContent = entry.text
    const meta = document.createElement('div')
    meta.className = 'meta'
    const date = document.createElement('span')
    date.className = 'date'
    date.textContent = formatDate(entry.savedAt)
    const recall = document.createElement('button')
    recall.type = 'button'
    recall.textContent = '呼び出す'
    recall.addEventListener('click', () => recallEntry(entry))
    const del = document.createElement('button')
    del.type = 'button'
    del.textContent = '削除'
    del.addEventListener('click', () => {
      history.splice(i, 1)
      store(KEY_HISTORY, history)
      renderHistory()
    })
    meta.append(date, recall, del)
    li.append(text, meta)
    return li
  }))
}

function save() {
  const text = buildText()
  if (!text) return
  history.unshift({ savedAt: new Date().toISOString(), singer: $('singer').value.trim(), song: $('song').value.trim(), tags: activeTags(), text })
  toast(store(KEY_HISTORY, history) ? '保存しました' : 'このブラウザでは保存できませんでした')
  renderHistory()
}

// 保存したときの Singer・曲名・タグの付け外しを入力欄に戻す。消してしまった追加タグは追加し直す
function recallEntry(entry) {
  $('singer').value = entry.singer
  $('song').value = entry.song
  for (const tag of entry.tags) {
    if (!DEFAULT_TAGS.includes(tag) && !addedTags.includes(tag)) addedTags.push(tag)
  }
  store(KEY_TAGS, addedTags)
  excluded.clear()
  for (const tag of [...DEFAULT_TAGS, ...addedTags]) {
    if (!entry.tags.includes(tag)) excluded.add(tag)
  }
  renderTags()
  update()
  window.scrollTo({ top: 0, behavior: 'smooth' })
  toast('呼び出しました')
}

function fillList(id, options) {
  $(id).replaceChildren(...options.map(({ value, label }) => {
    const option = document.createElement('option')
    option.value = value
    if (label) option.label = label
    return option
  }))
}

async function loadJson(url) {
  const res = await fetch(url)
  if (!res.ok) throw new Error(res.status)
  return res.json()
}

loadJson('/data/singers.json')
  .then((names) => fillList('singer-list', names.map((n) => ({ value: n }))))
  .catch(() => showNote('singer-note', 'Singer の候補を読み込めませんでした。手入力はできます。', true))
loadJson('/api/songs')
  .then((songs) => fillList('song-list', songs.map((s) => ({ value: s.title, label: s.artist }))))
  .catch(() => showNote('song-note', '曲名の候補を読み込めませんでした。手入力はできます。', true))

$('singer').addEventListener('input', update)
$('song').addEventListener('input', update)
$('add-tag').addEventListener('click', addTag)
$('new-tag').addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.isComposing) addTag() })
$('output').addEventListener('click', () => {
  const text = buildText()
  if (!text) return
  navigator.clipboard.writeText(text).then(() => toast('コピーしました'), () => toast('コピーできませんでした'))
})
$('save').addEventListener('click', save)

renderTags()
renderHistory()
update()
</script>
</body>
</html>
